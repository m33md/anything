name: Desktop build

on:
  push:
    paths:
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew --no-daemon --stacktrace compileKotlin

      - name: Package installers
        run: ./gradlew --no-daemon --stacktrace packageMsi packageExe createDistributable

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Convx -DestinationPath build/Convx-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-installers
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-portable
          path: desktop/build/Convx-portable-windows.zip
          if-no-files-found: error
