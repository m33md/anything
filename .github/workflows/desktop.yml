name: Desktop build

on:
  push:
    paths:
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - "canvas/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "innertube/**"
      - "lyrics/**"
      - "canvas/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Screenshots are pushed to the convx-desktop-snapshots branch.
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The runtime the installer ships: the JetBrains Runtime has the custom title bar the
      # app's top bar replaces Windows' with. Set up first so Temurin stays the build's Java.
      - uses: actions/setup-java@v5
        id: jbr
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: "21"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branch builds keep their dependency cache too, not only the default branch.
          cache-read-only: false

      - name: Compile
        run: ./gradlew --no-daemon compileKotlin

      - name: Playback check
        continue-on-error: true
        timeout-minutes: 5
        # Kept beside the screenshots, so the results can be read without the run's logs.
        run: |
          mkdir -p build/snapshots
          ./gradlew --no-daemon -q playbackCheck 2>&1 | tee build/snapshots/playback-check.txt
          exit ${PIPESTATUS[0]}

      - name: Screenshots
        id: snapshots
        continue-on-error: true
        timeout-minutes: 18
        run: |
          status=0
          ./gradlew --no-daemon snapshots || status=$?
          mkdir -p build/snapshots
          cp "$(cygpath -u "$LOCALAPPDATA")"/Convx/logs/*.log build/snapshots/ || true
          exit $status

      - name: Publish screenshots
        if: github.event_name == 'push' && hashFiles('desktop/build/snapshots/**') != ''
        continue-on-error: true
        working-directory: desktop/build/snapshots
        run: |
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" snapshots:convx-desktop-snapshots

      - name: Package installers
        env:
          CONVX_JBR: ${{ steps.jbr.outputs.path }}
        run: |
          if [ -n "$CONVX_JBR" ]; then
            echo "Packaging with the JetBrains Runtime at $CONVX_JBR"
            ls "$CONVX_JBR" "$CONVX_JBR/jmods" | head -20 || true
            ./gradlew --no-daemon packageMsi packageExe createDistributable && exit 0
            echo "::warning::Packaging with the JetBrains Runtime failed; falling back to Temurin (Windows title bar)"
          fi
          CONVX_JBR= ./gradlew --no-daemon packageMsi packageExe createDistributable

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/Convx -DestinationPath build/Convx-portable-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-installers
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Convx-windows-portable
          path: desktop/build/Convx-portable-windows.zip
          if-no-files-found: error

      # Same rolling pre-release as desktop-release.yml, refreshed after every build.
      - name: Publish download links
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash ../.github/scripts/publish-desktop-release.sh "$GITHUB_SHA" \
            build/compose/binaries/main/msi/*.msi \
            build/compose/binaries/main/exe/*.exe \
            build/Convx-portable-windows.zip
