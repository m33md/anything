name: Desktop release

# Publishes the newest finished Windows build as one rolling pre-release, so it has plain
# download links (no GitHub sign-in, no zip in a zip). Runs when this file changes;
# desktop.yml republishes after every later build.
on:
  push:
    branches: [convx-desktop]
    paths: [".github/workflows/desktop-release.yml"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Download the newest Windows build
        run: |
          run=$(gh run list -b convx-desktop -w "Desktop build" -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "SHA=$(gh run view "$run" --json headSha -q .headSha)" >> "$GITHUB_ENV"
          gh run download "$run" -n Convx-windows-installers -D out
          gh run download "$run" -n Convx-windows-portable -D out
          ls -la out

      - name: Publish
        run: bash .github/scripts/publish-desktop-release.sh "$SHA" out/msi/*.msi out/exe/*.exe out/*.zip
